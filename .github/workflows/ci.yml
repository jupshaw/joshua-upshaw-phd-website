name: Validate website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build.py
      - run: python3 scripts/check_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test serverless/contact-worker/tests/*.test.mjs
